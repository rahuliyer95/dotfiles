onboarding = false

[keys]
prefix = "ctrl+shift+space"
detach = "prefix+d"

[[keys.command]]
# lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
# lazygit: open in its own tab
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

[theme]
name = "tokyo-night"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = false, bold = true }],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"
